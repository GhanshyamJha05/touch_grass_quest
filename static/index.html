<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Touch Grass Quest</title>
    <style>
        :root {
            --bg: #f9fafb;
            --text: #111827;
            --accent: #16a34a;
            --accent-hover: #15803d;
            --card-bg: #ffffff;
            --border: #e5e7eb;
            --subtext: #6b7280;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --text: #f9fafb;
                --accent: #22c55e;
                --accent-hover: #16a34a;
                --card-bg: #1f2937;
                --border: #374151;
                --subtext: #9ca3af;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 1rem;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        .streak-container {
            font-size: 0.875rem;
            color: var(--subtext);
            background: var(--card-bg);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1px solid var(--border);
            display: inline-block;
        }

        main {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
            max-width: 24rem;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .task-container {
            margin-bottom: 2rem;
        }

        .task-label {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--subtext);
            margin-bottom: 0.5rem;
            display: block;
        }

        #task-text {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 1rem;
        }

        #task-hint {
            font-size: 1rem;
            color: var(--subtext);
            font-style: italic;
        }

        .file-upload {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-upload input[type="file"] {
            position: absolute;
            font-size: 100px;
            opacity: 0;
            right: 0;
            top: 0;
            cursor: pointer;
            height: 100%;
        }

        .camera-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.125rem;
            font-weight: 600;
            border-radius: 0.75rem;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .camera-btn:hover, .camera-btn:focus-within {
            background-color: var(--accent-hover);
        }
        
        .camera-btn:focus-within {
            outline: 2px solid var(--text);
            outline-offset: 2px;
        }

        #result {
            margin-top: 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            min-height: 1.5rem;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* Done state */
        .done-state {
            display: none;
        }

        .done-state h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .done-state p {
            color: var(--subtext);
        }

        .active-state {
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>Touch Grass Quest</h1>
        <div class="streak-container">
            Streak: <span id="streak-count">0</span> 🔥
        </div>
    </header>

    <main id="main-card">
        <div id="active-view" class="active-state">
            <div class="task-container">
                <span class="task-label">Today's Quest</span>
                <div id="task-text">Loading...</div>
                <div id="task-hint"></div>
            </div>

            <div class="file-upload">
                <button class="camera-btn" aria-hidden="true" tabindex="-1">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    Take Photo
                </button>
                <input type="file" id="photo-input" accept="image/*" capture="environment" aria-label="Take a photo for today's quest">
            </div>

            <img id="preview-img" alt="Preview of your photo" style="max-width: 100%; border-radius: 0.75rem; margin-top: 1.5rem; display: none; object-fit: cover;" />
            <button id="submit-btn" style="display: none; width: 100%; margin-top: 1rem; background: var(--accent); color: #000; padding: 1rem; border-radius: 0.75rem; font-size: 1.1rem; font-weight: bold; border: none; cursor: pointer; transition: opacity 0.2s;">Submit Photo</button>
            <div id="result" role="status" aria-live="polite"></div>
        </div>

        <div id="done-view" class="done-state">
            <h2>Done for today.</h2>
            <p>Go touch more grass. See you tomorrow!</p>
            <button id="reset-btn" style="margin-top: 2rem; background: transparent; border: 1px solid var(--border); color: var(--subtext); padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer;">[Dev] Reset Progress</button>
        </div>
    </main>

    <script>
        const DOM = {
            taskText: document.getElementById('task-text'),
            taskHint: document.getElementById('task-hint'),
            photoInput: document.getElementById('photo-input'),
            result: document.getElementById('result'),
            previewImg: document.getElementById('preview-img'),
            streakCount: document.getElementById('streak-count'),
            activeView: document.getElementById('active-view'),
            doneView: document.getElementById('done-view'),
            cameraBtn: document.querySelector('.camera-btn'),
            submitBtn: document.getElementById('submit-btn'),
            resetBtn: document.getElementById('reset-btn')
        };

        DOM.resetBtn.addEventListener('click', () => {
            localStorage.removeItem('streak');
            location.reload();
        });

        let currentTaskId = null;

        // Streak management
        const Streak = {
            get() {
                try {
                    const data = localStorage.getItem('streak');
                    if (data) return JSON.parse(data);
                } catch(e) { console.error('Storage error', e); }
                return { count: 0, lastDate: null };
            },
            save(data) {
                try {
                    localStorage.setItem('streak', JSON.stringify(data));
                } catch(e) { console.error('Storage error', e); }
            },
            updateAndCheck() {
                const today = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD local
                const streak = this.get();
                DOM.streakCount.textContent = streak.count;

                if (streak.lastDate === today) {
                    DOM.activeView.classList.remove('active-state');
                    DOM.activeView.classList.add('done-state');
                    DOM.doneView.classList.remove('done-state');
                    DOM.doneView.classList.add('active-state');
                    return true;
                }
                
                // Reset if missed a day
                if (streak.lastDate) {
                    const last = new Date(streak.lastDate);
                    const now = new Date(today);
                    const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));
                    if (diffDays > 1) {
                        streak.count = 0;
                        this.save(streak);
                        DOM.streakCount.textContent = '0';
                    }
                }
                return false;
            },
            increment() {
                const today = new Date().toLocaleDateString('en-CA');
                const streak = this.get();
                streak.count += 1;
                streak.lastDate = today;
                this.save(streak);
                DOM.streakCount.textContent = streak.count;
            }
        };

        async function init() {
            if (Streak.updateAndCheck()) return;

            try {
                const res = await fetch('/api/task');
                if (!res.ok) throw new Error('Network error');
                const task = await res.json();
                currentTaskId = task.id;
                DOM.taskText.textContent = task.text;
                DOM.taskHint.textContent = task.hint;
            } catch(e) {
                DOM.taskText.textContent = "Couldn't load task. Try refreshing.";
            }
        }

        // Image downscaling
        function downscaleImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX = 1024;

                        if (width > height) {
                            if (width > MAX) {
                                height *= MAX / width;
                                width = MAX;
                            }
                        } else {
                            if (height > MAX) {
                                width *= MAX / height;
                                height = MAX;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', 0.8);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        const cameraIcon = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>`;

        DOM.photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Show preview and submit button
            DOM.previewImg.src = URL.createObjectURL(file);
            DOM.previewImg.style.display = 'block';
            DOM.submitBtn.style.display = 'block';
            
            // Update button text to allow retakes
            DOM.cameraBtn.innerHTML = cameraIcon + ' Retake Photo';
            DOM.cameraBtn.style.background = 'transparent';
            DOM.cameraBtn.style.border = '2px solid var(--accent)';
            DOM.cameraBtn.style.color = 'var(--accent)';
            
            // Clear previous errors if they exist
            DOM.result.textContent = '';
        });

        DOM.submitBtn.addEventListener('click', async () => {
            const file = DOM.photoInput.files[0];
            if (!file) return;

            DOM.result.textContent = "Checking your photo...";
            DOM.result.style.color = 'var(--subtext)';
            DOM.submitBtn.disabled = true;
            DOM.submitBtn.style.opacity = '0.5';
            DOM.submitBtn.textContent = 'Verifying...';
            DOM.cameraBtn.style.pointerEvents = 'none';
            DOM.cameraBtn.style.opacity = '0.5';

            try {
                const blob = await downscaleImage(file);
                
                const formData = new FormData();
                formData.append('photo', blob, 'photo.jpg');
                formData.append('taskId', currentTaskId);

                const res = await fetch('/api/check', {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(errText || 'Verification failed');
                }

                const data = await res.json();
                DOM.result.textContent = data.message;
                DOM.result.style.color = data.success ? 'var(--accent)' : 'inherit';

                if (data.success) {
                    Streak.increment();
                    setTimeout(() => {
                        Streak.updateAndCheck();
                        DOM.previewImg.style.display = 'none';
                        DOM.submitBtn.style.display = 'none';
                        DOM.result.textContent = '';
                        
                        // Reset camera button styles for tomorrow
                        DOM.cameraBtn.innerHTML = cameraIcon + ' Take Photo';
                        DOM.cameraBtn.style = '';
                    }, 2500);
                }
            } catch (err) {
                DOM.result.textContent = err.message || "An error occurred. Try again.";
            } finally {
                DOM.submitBtn.disabled = false;
                DOM.submitBtn.style.opacity = '1';
                DOM.submitBtn.textContent = 'Submit Photo';
                DOM.cameraBtn.style.pointerEvents = 'auto';
                DOM.cameraBtn.style.opacity = '1';
            }
        });

        init();
    </script>
</body>
</html>
